# Puerto del sistema. Se entra a localhost:8080. No cambiar.
server.port=${APP_PORT:8080} 

spring.application.name=sistema-restaurante

spring.datasource.url=jdbc:mysql://localhost:3306/restaurante_db
# Usuario y contraseña. Si la tuya no es root, se pone en IntelliJ como variable DB_PASS, no aqui. No cambiar.
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl