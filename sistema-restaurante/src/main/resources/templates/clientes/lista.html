<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Clientes</title>
</head>
<body>
<section>
    <div class="page-header">
        <h2>Clientes</h2>
        <a th:href="@{/clientes/nuevo}" class="btn btn-primary">Nuevo cliente</a>
    </div>

    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Dirección</th>
            <th>Puntos</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.usuario.nombre}"></td>
            <td th:text="${c.usuario.email}"></td>
            <td th:text="${c.telefono}"></td>
            <td th:text="${c.adress}"></td>
            <td th:text="${c.loyalty}"></td>
            <td class="text-end">
                <a th:href="@{/clientes/editar/{id}(id=${c.idCliente})}"
                   class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/clientes/eliminar/{id}(id=${c.idCliente})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Eliminar este cliente?')">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(clientes)}">
            <td colspan="6" class="text-center text-muted">No hay clientes registrados.</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
