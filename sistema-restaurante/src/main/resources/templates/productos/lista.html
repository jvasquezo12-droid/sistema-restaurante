<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Productos</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 mb-0">Productos del menú</h2>
        <a th:href="@{/productos/nuevo}" class="btn btn-primary">Nuevo producto</a>
    </div>

    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Categoría</th>
            <th>Disponibilidad</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${productos}">
            <td th:text="${p.nombre}"></td>
            <td th:text="${p.descripcion}"></td>
            <td th:text="${p.precio}"></td>
            <td th:text="${p.categoria.nombre}"></td>
            <td>
                <span class="badge bg-success" th:if="${p.disponible}">Disponible</span>
                <span class="badge bg-secondary" th:unless="${p.disponible}">No disponible</span>
            </td>
            <td class="text-end">
                <a th:href="@{/productos/editar/{id}(id=${p.idProducto})}"
                   class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/productos/eliminar/{id}(id=${p.idProducto})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Eliminar este producto?')">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(productos)}">
            <td colspan="6" class="text-center text-muted">No hay productos registrados.</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
