<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Detalle del pedido</title>
</head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Pedido n.º <span th:text="${pedido.idPedido}"></span></h2>
        <div>
            <a class="btn btn-warning"
               th:href="@{'/pedidos/editar/' + ${pedido.idPedido}}">Editar pedido</a>
            <a class="btn btn-secondary" th:href="@{/pedidos}">Volver</a>
        </div>
    </div>

    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="card mb-4">
        <div class="card-body">
            <p class="mb-1">
                <strong>Mesa:</strong>
                <span th:text="${pedido.mesa != null} ? ${pedido.mesa.numero} : ''"></span>
            </p>
            <p class="mb-1">
                <strong>Atendido por:</strong>
                <span th:text="${pedido.usuario != null} ? ${pedido.usuario.nombre} : ''"></span>
            </p>
            <p class="mb-1">
                <strong>Estado:</strong>
                <span class="badge bg-secondary"
                      th:text="${pedido.estado != null} ? ${pedido.estado.nombre} : ''"></span>
            </p>
            <p class="mb-0" th:if="${pedido.nota != null and !pedido.nota.isEmpty()}">
                <strong>Nota:</strong> <span th:text="${pedido.nota}"></span>
            </p>
        </div>
    </div>

    <h4>Agregar un producto</h4>

    <form class="row g-2 align-items-start mb-4" method="post"
          th:action="@{/pedidos/detalle/guardar}" th:object="${detalle}">
        <input type="hidden" th:field="*{pedido.idPedido}"/>

        <div class="col-md-4">
            <label class="form-label">Producto</label>
            <select class="form-select" th:field="*{producto.idProducto}"
                    th:classappend="${#fields.hasErrors('producto')} ? 'is-invalid' : ''">
                <option value="">Seleccione un producto</option>
                <option th:each="pr : ${productos}"
                        th:value="${pr.idProducto}"
                        th:text="${pr.nombre} + ' - Q ' + ${#numbers.formatDecimal(pr.precio, 1, 2)}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('producto')}"
                 th:errors="*{producto}"></div>
        </div>

        <div class="col-md-2">
            <label class="form-label">Cantidad</label>
            <input type="number" class="form-control" min="1" th:field="*{cantidad}"
                   th:classappend="${#fields.hasErrors('cantidad')} ? 'is-invalid' : ''"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('cantidad')}"
                 th:errors="*{cantidad}"></div>
        </div>

        <div class="col-md-4">
            <label class="form-label">Nota para la cocina</label>
            <input type="text" class="form-control" th:field="*{notes}"
                   th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('notes')}"
                 th:errors="*{notes}"></div>
        </div>

        <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Agregar</button>
        </div>
    </form>

    <h4>Productos del pedido</h4>

    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th>Producto</th>
            <th class="text-center">Cantidad</th>
            <th class="text-end">Precio</th>
            <th class="text-end">Subtotal</th>
            <th>Nota</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${detalles}">
            <td th:text="${d.producto != null} ? ${d.producto.nombre} : ''"></td>
            <td class="text-center" th:text="${d.cantidad}"></td>
            <td class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(d.precioUnitario, 1, 2)}"></td>
            <td class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(d.subtotal, 1, 2)}"></td>
            <td th:text="${d.notes}"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-danger"
                   th:href="@{'/pedidos/detalle/eliminar/' + ${d.idDetalle}}"
                   onclick="return confirm('¿Quitar este producto del pedido?');">Quitar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(detalles)}">
            <td colspan="6" class="text-center">Este pedido todavía no tiene productos</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="3" class="text-end">Total del pedido</th>
            <th class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(total, 1, 2)}"></th>
            <th colspan="2"></th>
        </tr>
        </tfoot>
    </table>

</section>
</body>
</html>
