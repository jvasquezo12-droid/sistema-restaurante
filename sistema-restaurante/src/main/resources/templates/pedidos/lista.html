<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Pedidos</title>
</head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Pedidos</h2>
        <a class="btn btn-primary" th:href="@{/pedidos/nuevo}">Nuevo pedido</a>
    </div>

    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form class="row g-2 mb-3" method="get" th:action="@{/pedidos}">
        <div class="col-auto">
            <select class="form-select" name="estadoId">
                <option value="">Todos los estados</option>
                <option th:each="e : ${estados}"
                        th:value="${e.idEstadoPedido}"
                        th:text="${e.nombre}"
                        th:selected="${estadoSeleccionado != null and estadoSeleccionado == e.idEstadoPedido}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary" type="submit">Filtrar estado</button>
        </div>
        <div class="col-auto">
            <a class="btn btn-outline-secondary" th:href="@{/pedidos}">Limpiar</a>
        </div>
    </form>

    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th>#</th>
            <th>Mesa</th>
            <th>Atiende</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${pedidos}">
            <td th:text="${p.idPedido}"></td>
            <td th:text="${p.mesa != null} ? ${p.mesa.numero} : ''"></td>
            <td th:text="${p.usuario != null} ? ${p.usuario.nombre} : ''"></td>
            <td th:text="${#temporals.format(p.getFCreation(), 'dd/MM/yyyy HH:mm')}"></td>
            <td>
                <span class="badge bg-secondary"
                      th:text="${p.estado != null} ? ${p.estado.nombre} : ''"></span>
            </td>
            <td class="text-end">
                <a class="btn btn-sm btn-primary"
                   th:href="@{'/pedidos/ver/' + ${p.idPedido}}">Ver</a>
                <a class="btn btn-sm btn-warning"
                   th:href="@{'/pedidos/editar/' + ${p.idPedido}}">Editar</a>
                <a class="btn btn-sm btn-danger"
                   th:href="@{'/pedidos/eliminar/' + ${p.idPedido}}"
                   onclick="return confirm('¿Seguro que desea eliminar este pedido?');">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(pedidos)}">
            <td colspan="6" class="text-center">No hay pedidos registrados</td>
        </tr>
        </tbody>
    </table>

</section>
</body>
</html>
