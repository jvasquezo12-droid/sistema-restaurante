<!DOCTYPE html>
<!--
    Plantilla base. Cada vista la usa asi:

    <!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org"
          th:replace="~{layout :: layout(~{::title}, ~{::section})}">
    <head><title>Mi titulo</title></head>
    <body>
        <section> ...contenido de la pantalla... </section>
    </body>
    </html>

    Los estilos propios estan en static/css/styles.css
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${titulo}">Sistema Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Encabezado y menu -->
    <header class="site-header navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <span>Sistema Restaurante
                    <small class="brand-sub">Reservaciones · Pedidos · Facturación</small>
                </span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                    aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse justify-content-end" id="menuPrincipal">

                <!-- Menu. Cada opcion se muestra segun el rol del usuario -->
                <ul class="navbar-nav site-nav">

                    <li class="nav-item" th:if="${session.rol == 'Administrador'}">
                        <a class="nav-link" th:href="@{/categorias}">Categorías</a>
                    </li>

                    <li class="nav-item" th:if="${session.rol == 'Administrador' or session.rol == 'Cocina'}">
                        <a class="nav-link" th:href="@{/productos}">Productos</a>
                    </li>

                    <li class="nav-item" th:if="${session.rol == 'Administrador' or session.rol == 'Mesero' or session.rol == 'Recepcionista'}">
                        <a class="nav-link" th:href="@{/mesas}">Mesas</a>
                    </li>

                    <li class="nav-item" th:if="${session.rol == 'Administrador' or session.rol == 'Recepcionista'}">
                        <a class="nav-link" th:href="@{/clientes}">Clientes</a>
                    </li>

                </ul>

                <!-- Usuario conectado y boton de salir -->
                <div class="user-box" th:if="${session.usuario != null}">
                    <span class="user-name">
                        <span th:text="${session.nombreUsuario}">Usuario</span>
                        <small>(<span th:text="${session.rol}">Rol</span>)</small>
                    </span>
                    <a class="btn btn-sm btn-outline-light" th:href="@{/logout}">Cerrar sesión</a>
                </div>

            </nav>
        </div>
    </header>

    <!-- Contenido de cada pantalla -->
    <main class="container my-4 flex-grow-1">
        <th:block th:replace="${contenido}">Contenido</th:block>
    </main>

    <!-- Pie de pagina -->
    <footer class="site-footer mt-auto">
        <div class="container">
            <strong>Sistema Restaurante</strong> &copy; 2026 · Proyecto de Programación II
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Marca en el menu la seccion en la que estamos
        document.querySelectorAll('.site-nav .nav-link').forEach(function (enlace) {
            if (location.pathname.indexOf(new URL(enlace.href).pathname) === 0) {
                enlace.classList.add('active');
            }
        });
    </script>

</body>
</html>
