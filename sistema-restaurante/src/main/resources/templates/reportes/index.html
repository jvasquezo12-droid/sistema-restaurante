<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Módulo de Reportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4 text-center">Módulo de Reportes y Estadísticas</h2>

    <div class="row g-4 justify-content-center mt-2">
        <div class="col-md-5">
            <div class="card h-100 shadow-sm border-primary">
                <div class="card-body text-center">
                    <h5 class="card-title text-primary">Ventas por Rango de Fechas</h5>
                    <p class="card-text text-muted">Consulta el total acumulado de ventas e ingresos diarios dentro de un período específico.</p>
                    <a th:href="@{/reportes/ventas-por-fecha}" class="btn btn-primary">Ver Reporte</a>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card h-100 shadow-sm border-success">
                <div class="card-body text-center">
                    <h5 class="card-title text-success">Productos Más Vendidos</h5>
                    <p class="card-text text-muted">Muestra los platillos y bebidas con mayor demanda y el total generado por cada uno.</p>
                    <a th:href="@{/reportes/productos-mas-vendidos}" class="btn btn-success">Ver Reporte</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
