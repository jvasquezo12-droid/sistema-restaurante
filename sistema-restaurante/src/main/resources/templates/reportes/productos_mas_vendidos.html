<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Productos Más Vendidos</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Top 10 Productos Más Vendidos</h2>
        <div class="no-print">
            <button onclick="window.print()" class="btn btn-secondary me-2">Imprimir</button>
            <a th:href="@{/reportes}" class="btn btn-outline-primary">Volver a Reportes</a>
        </div>
    </div>

    <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Producto</th>
            <th>Cantidad Vendida</th>
            <th>Total Vendido (Q)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p, iter : ${reporte}">
            <td th:text="${iter.count}">1</td>
            <td th:text="${p.nombreProducto}">Producto</td>
            <td th:text="${p.cantidadTotal}">0</td>
            <td th:text="'Q ' + ${#numbers.formatDecimal(p.totalVendido, 1, 'COMMA', 2, 'POINT')}">Q 0.00</td>
        </tr>
        <tr th:if="${#lists.isEmpty(reporte)}">
            <td colspan="4" class="text-center text-muted">No hay registros disponibles.</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
