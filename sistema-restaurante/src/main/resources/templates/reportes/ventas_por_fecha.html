<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Reporte de Ventas por Fecha</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Reporte de Ventas por Fecha</h2>
        <div class="no-print">
            <button onclick="window.print()" class="btn btn-secondary me-2">Imprimir</button>
            <a th:href="@{/reportes}" class="btn btn-outline-primary">Volver a Reportes</a>
        </div>
    </div>

    <form th:action="@{/reportes/ventas-por-fecha}" method="get" class="row g-3 mb-4 no-print">
        <div class="col-md-4">
            <label class="form-label">Fecha Inicio:</label>
            <input type="date" name="fechaInicio" th:value="${fechaInicio}" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Fecha Fin:</label>
            <input type="date" name="fechaFin" th:value="${fechaFin}" class="form-control" required>
        </div>
        <div class="col-md-4 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Filtrar</button>
        </div>
    </form>

    <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
        <tr>
            <th>Fecha</th>
            <th>Pedidos Totales</th>
            <th>Monto Total (Q)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${ventas}">
            <td th:text="${v.fecha}">2026-10-15</td>
            <td th:text="${v.cantidadPedidos}">0</td>
            <td th:text="'Q ' + ${#numbers.formatDecimal(v.totalVentas, 1, 'COMMA', 2, 'POINT')}">Q 0.00</td>
        </tr>
        <tr th:if="${#lists.isEmpty(ventas)}">
            <td colspan="3" class="text-center text-muted">No se encontraron ventas en el rango seleccionado.</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
