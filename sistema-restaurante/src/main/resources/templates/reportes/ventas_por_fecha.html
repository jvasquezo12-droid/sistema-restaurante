<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Reporte de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos especificos para impresion -->
    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            .card {
                border: none !important;
            }
            body {
                padding: 0;
                background-color: white;
            }
        }
    </style>
</head>
<body>
<div class="container mt-4">

    <!-- Encabezado y Filtros (Se ocultan al imprimir) -->
    <div class="no-print">
        <h2 class="mb-3">Panel de Reportes</h2>
        <form th:action="@{/reportes/ventas-por-fecha}" method="get" class="row g-3 mb-4">
            <div class="col-md-4">
                <label for="fechaInicio" class="form-label fw-bold">Fecha Inicio:</label>
                <input type="date" id="fechaInicio" name="fechaInicio" class="form-control" th:value="${fechaInicio}">
            </div>
            <div class="col-md-4">
                <label for="fechaFin" class="form-label fw-bold">Fecha Fin:</label>
                <input type="date" id="fechaFin" name="fechaFin" class="form-control" th:value="${fechaFin}">
            </div>
            <div class="col-md-4 d-flex align-items-end gap-2">
                <button type="submit" class="btn btn-primary">Filtrar</button>
                <button type="button" onclick="window.print()" class="btn btn-success">Imprimir Reporte</button>
            </div>
        </form>
    </div>

    <!-- Encabezado Imprimible -->
    <div class="text-center mb-4">
        <h2>Restaurante MiMesa</h2>
        <h4 th:text="${titulo}"></h4>
        <p class="text-muted">
            Rango: <span th:text="${fechaInicio}"></span> al <span th:text="${fechaFin}"></span>
        </p>
    </div>

    <!-- Tabla del Reporte -->
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Fecha</th>
            <th>Total Pedidos</th>
            <th>Monto Total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${ventas}">
            <td th:text="${v.fecha}"></td>
            <td th:text="${v.cantidadPedidos}"></td>
            <td th:text="${'$' + #numbers.formatDecimal(v.totalVentas, 1, 2)}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(ventas)}">
            <td colspan="3" class="text-center text-muted">No hay registros de ventas para el período seleccionado.</td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
