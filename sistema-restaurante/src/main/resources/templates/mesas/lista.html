<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Mesas</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 mb-0">Mesas</h2>
        <a th:href="@{/mesas/nueva}" class="btn btn-primary">Nueva mesa</a>
    </div>

    <!-- Formulario de filtro por estado -->
    <form th:action="@{/mesas}" method="get" class="row g-3 mb-4">
        <div class="col-md-6">
            <select name="estadoId" class="form-select">
                <option value="">-- Todos los Estados --</option>
                <option th:each="est : ${estados}"
                        th:value="${est.idEstadoMesa}"
                        th:text="${est.nombre}"
                        th:selected="${param.estadoId != null and param.estadoId[0] == #strings.toString(est.idEstadoMesa)}">
                </option>
            </select>
        </div>
        <div class="col-md-6 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Filtrar Estado</button>
            <a th:href="@{/mesas}" class="btn btn-secondary">Limpiar</a>
        </div>
    </form>

    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>Número</th>
            <th>Capacidad</th>
            <th>Ubicación</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${mesas}">
            <td th:text="${m.numero}"></td>
            <td th:text="${m.capacidad}"></td>
            <td th:text="${m.loc}"></td>
            <td th:text="${m.estado.nombre}"></td>
            <td class="text-end">
                <a th:href="@{/mesas/editar/{id}(id=${m.idMesa})}"
                   class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/mesas/eliminar/{id}(id=${m.idMesa})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Eliminar esta mesa?')">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(mesas)}">
            <td colspan="5" class="text-center text-muted">No hay mesas registradas.</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
