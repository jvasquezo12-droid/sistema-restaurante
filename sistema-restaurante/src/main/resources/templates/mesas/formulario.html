<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Mesa</title>
</head>
<body>
<section>

    <h2 class="h3 mb-3" th:text="${mesa.idMesa} == null ? 'Nueva mesa' : 'Editar mesa'">Mesa</h2>

    <form method="post" th:action="@{/mesas/guardar}" th:object="${mesa}">
        <input type="hidden" th:field="*{idMesa}"/>

        <div class="mb-3">
            <label class="form-label">Número</label>
            <input type="number" class="form-control" th:field="*{numero}"
                   th:classappend="${#fields.hasErrors('numero')} ? 'is-invalid' : ''"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('numero')}"
                 th:errors="*{numero}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Capacidad</label>
            <input type="number" class="form-control" th:field="*{capacidad}"
                   th:classappend="${#fields.hasErrors('capacidad')} ? 'is-invalid' : ''"/>
            <div class="form-text">Cantidad máxima de personas que admite la mesa.</div>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('capacidad')}"
                 th:errors="*{capacidad}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Ubicación</label>
            <input type="text" class="form-control" th:field="*{loc}"
                   th:classappend="${#fields.hasErrors('loc')} ? 'is-invalid' : ''"/>
            <div class="form-text">Por ejemplo: Terraza, Salón principal, Salón VIP o Barra.</div>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('loc')}"
                 th:errors="*{loc}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Estado</label>
            <select class="form-select" th:field="*{estado.idEstadoMesa}"
                    th:classappend="${#fields.hasErrors('estado')} ? 'is-invalid' : ''">
                <option value="">Seleccione el estado</option>
                <option th:each="e : ${estados}"
                        th:value="${e.idEstadoMesa}"
                        th:text="${e.nombre}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('estado')}"
                 th:errors="*{estado}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a class="btn btn-secondary" th:href="@{/mesas}">Cancelar</a>
    </form>

</section>
</body>
</html>
