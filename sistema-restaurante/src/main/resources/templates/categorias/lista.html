<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Categorías</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 mb-0">Categorías</h2>
        <a th:href="@{/categorias/nueva}" class="btn btn-primary">Nueva categoría</a>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="categoria : ${categorias}">
            <td th:text="${categoria.nombre}"></td>
            <td th:text="${categoria.descripcion}"></td>
            <td class="text-end">
                <a th:href="@{/categorias/editar/{id}(id=${categoria.idCategoria})}"
                   class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/categorias/eliminar/{id}(id=${categoria.idCategoria})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Eliminar esta categoría?')">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categorias)}">
            <td colspan="3" class="text-center text-muted">No hay categorías registradas.</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
